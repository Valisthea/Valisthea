<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Valisthea — Kairos Lab Security Research">
  <title>Valisthea — Kairos Lab Security Research</title>

  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13151C"/>
      <stop offset="0.55" stop-color="#0D0E12"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A93B" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#F2A93B" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#F2A93B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.22" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#F2A93B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#E8E3D9" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="16"/>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; }
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }
      .scan { animation: sweep 7.5s linear infinite; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes sweep {
        0%   { transform: translateY(-24px); }
        100% { transform: translateY(344px); }
      }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .scan { animation: none; opacity: 0.18; }
        .caret { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#plate)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- corner ticks -->
    <g stroke="#F2A93B" stroke-opacity="0.45" stroke-width="1.5" fill="none">
      <path d="M28 52 V28 H52"/>
      <path d="M1148 52 V28 H1124"/>
      <path d="M28 268 V292 H52"/>
      <path d="M1148 268 V292 H1124"/>
    </g>

    <!-- eyebrow -->
    <text class="mono" x="64" y="88" fill="#7A828E" font-size="14" letter-spacing="7">KAIROS LAB · SECURITY RESEARCH</text>

    <!-- wordmark -->
    <text class="mono" x="60" y="176" fill="#EDE7DC" font-size="76" font-weight="700" letter-spacing="12">VALISTHEA</text>

    <!-- rule -->
    <rect x="64" y="200" width="300" height="2" fill="#F2A93B" opacity="0.75"/>

    <!-- tagline -->
    <text class="serif" x="64" y="240" fill="#A9A399" font-size="23" font-style="italic">Smart contract audits, bug bounty, and the tools in between.</text>

    <!-- prompt -->
    <text class="mono" x="64" y="278" fill="#F2A93B" font-size="15" letter-spacing="2">&gt; audit · exploit · disclose</text>
    <rect class="caret" x="330" y="265" width="9" height="17" fill="#F2A93B"/>

    <!-- seal -->
    <g transform="translate(1000 108)">
      <image href="data:image/png;base64," x="0" y="0" width="104" height="104"/>
    </g>

    <!-- scanline -->
    <rect class="scan" x="0" y="0" width="1200" height="2.5" fill="url(#scanGrad)"/>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="16" fill="none" stroke="#F2A93B" stroke-opacity="0.22" stroke-width="1.5"/>
</svg>
